<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Creative preset — collision check</title>
<style>
  body { margin:0; background:#1b1b1b; font-family: system-ui, sans-serif; color:#eee; padding:20px; }
  h2 { font-size:14px; margin:0 0 8px; font-weight:600; color:#bbb; }
  .wrap { display:flex; gap:24px; flex-wrap:wrap; }
  .box { }
  .canvas {
    position:relative;
    width:877px; height:620px;              /* 3508x2480 scaled 0.25 */
    background-size:100% 100%;
    overflow:hidden;
    border:1px solid #333;
  }
  .el { position:absolute; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <h2>BEFORE (old creativeBg watermark across text)</h2>
    <div class="canvas" id="before"></div>
  </div>
  <div class="box">
    <h2>AFTER (fixed)</h2>
    <div class="canvas" id="after"></div>
  </div>
</div>

<script src="presets-real.js"></script>
<script>
const OLD_BG = "data:image/svg+xml;base64,PHN2ZyB2aWV3Qm94PScwIDAgMzUwOCAyNDgwJyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0nY3JlYXRpdmVHcmFkJyB4MT0nMCUnIHkxPScwJScgeDI9JzEwMCUnIHkyPScxMDAlJz48c3RvcCBvZmZzZXQ9JzAlJyBzdG9wLWNvbG9yPScjZmZmMWYyJyAvPjxzdG9wIG9mZnNldD0nMTAwJScgc3RvcC1jb2xvcj0nI2ZmZTRlNicgLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0nMzUwOCcgaGVpZ2h0PScyNDgwJyBmaWxsPSd1cmwoI2NyZWF0aXZlR3JhZCknIC8+PHRleHQgeD0nMTc1NCcgeT0nMTU1MCcgZm9udC1mYW1pbHk9J3NhbnMtc2VyaWYnIGZvbnQtc2l6ZT0nMTA1MicgZm9udC13ZWlnaHQ9JzkwMCcgZmlsbD0nI2ZlY2RkMycgb3BhY2l0eT0nMC40JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJz5TSElNPC90ZXh0PjxjaXJjbGUgY3g9JzQzOCcgY3k9JzQ0Micgcj0nNjU3JyBmaWxsPScjZjQzZjVlJyBvcGFjaXR5PScwLjEnIC8+PGNpcmNsZSBjeD0nMzA3MCcgY3k9JzE5OTInIHI9Jzg3NycgZmlsbD0nI2ZiOTIzYycgb3BhY2l0eT0nMC4xJyAvPjxyZWN0IHg9JzI2MycgeT0nMTU1MCcgd2lkdGg9JzM1MCcgaGVpZ2h0PSczNScgZmlsbD0nI2Y0M2Y1ZScgLz48L3N2Zz4=";

const PRESET = window.REAL_PRESETS.find(p => p.id === "creative");
const S = 3508 / 877;                 // canvas px -> preview px
const SAMPLES = {
  recipientName: "Jane Doe",
  eventName: "Event Description",
  certificateId: "SHIM-2026-0001",
  role: "Role / Title",
  issueDate: "October 4, 2026",
};

function render(node, bgUrl, preset) {
  node.style.backgroundImage = `url(${bgUrl})`;
  preset.design.canvasElements.forEach(el => {
    const d = document.createElement("div");
    d.className = "el";
    d.style.left = (el.x / S) + "px";
    d.style.top = (el.y / S) + "px";
    if (el.width) d.style.width = (el.width / S) + "px";
    if (el.height) d.style.height = (el.height / S) + "px";
    d.style.fontSize = ((el.fontSize || 16) / S) + "px";
    d.style.fontFamily = "system-ui, sans-serif";
    d.style.color = el.color;
    d.style.fontWeight = el.fontWeight || "400";
    d.style.textAlign = el.align || "left";
    d.style.lineHeight = "1.2";
    d.style.letterSpacing = el.letterSpacing ? (el.letterSpacing / S) + "px" : "normal";

    if (el.type === "staticText") d.textContent = el.text;
    else if (el.type === "dynamicText") d.textContent = SAMPLES[el.text] || el.text;
    else if (el.type === "shape") { d.style.height = (el.height / S) + "px"; d.style.background = el.color; }
    else if (el.type === "signature") {
      d.style.display = "flex"; d.style.flexDirection = "column";
      d.style.alignItems = el.align === "center" ? "center" : "flex-start";
      d.innerHTML = `<div style="font-size:${(120*1.5/S)}px;font-style:italic;color:${el.color}">Maya Lin</div>` +
                    `<div style="width:100%;border-top:2px solid ${el.color};margin:6px 0"></div>` +
                    `<div style="font-size:${(120*0.4/S)}px;font-weight:bold;letter-spacing:2px;color:${el.color}">CREATIVE DIRECTOR</div>`;
    }
    node.appendChild(d);
  });
}

render(document.getElementById("before"), OLD_BG, PRESET);
render(document.getElementById("after"), PRESET.design.backgroundImageUrl, PRESET);
document.title = "ready";
</script>
</body>
</html>
