<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#e5e7eb;font:11px/1.3 system-ui,sans-serif}
  .cat{padding:10px 14px}
  .cat h2{margin:0 0 8px;font-size:15px;color:#111}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cell{background:#fff;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden}
  .thumb{width:100%;aspect-ratio:1122/793;background-size:cover;display:block}
  .meta{padding:4px 6px;display:flex;justify-content:space-between;gap:5px}
  .id{font-weight:700;color:#0369a1}
  .nm{color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<div id="root"></div>
<script>
fetch('./backgrounds.json').then(r=>r.json()).then(d=>{
  const root=document.getElementById('root');
  const only=["Sports & Athletics","Medical & Healthcare","Kids & Early Learning"];
  for(const cat of d.categories){
    if(!only.includes(cat.name))continue;
    const sec=document.createElement('div');sec.className='cat';
    const h=document.createElement('h2');h.textContent=cat.name;sec.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    for(const it of cat.items){
      const c=document.createElement('div');c.className='cell';
      const t=document.createElement('div');t.className='thumb';t.style.backgroundImage='url("'+it.url+'")';
      const m=document.createElement('div');m.className='meta';
      m.innerHTML='<span class="id">'+it.id+'</span><span class="nm">'+it.name+'</span>';
      c.appendChild(t);c.appendChild(m);g.appendChild(c);
    }
    sec.appendChild(g);root.appendChild(sec);
  }
});
</script></body></html>
