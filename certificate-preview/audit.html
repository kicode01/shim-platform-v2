<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="log" style="font:12px monospace;white-space:pre"></div>
<script>
const W=1122,H=793;
// band = where the name + event text sits: x 6%..94% of 1122, y 36%..76% of 793
const BX=Math.round(W*0.06), BY=Math.round(H*0.36), BW=Math.round(W*0.88), BH=Math.round(H*0.40);
let out='';
function lum(r,g,b){const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}
function contrast(L1,L2){const a=Math.max(L1,L2),b=Math.min(L1,L2);return (a+0.05)/(b+0.05)}
fetch('./redesigned-backgrounds.json').then(r=>r.json()).then(async d=>{
  const flags=[];
  for(const cat of d.categories){
    for(const it of cat.items){
      const img=new Image();
      const p=new Promise(res=>{img.onload=res;img.onerror=res;});
      img.src=it.url; await p;
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;
      const cx=cv.getContext('2d',{willReadFrequently:true});
      cx.drawImage(img,0,0,W,H);
      let rs=0,gs=0,bs=0,n=0;
      for(let y=BY;y<BY+BH;y+=14)for(let x=BX;x<BX+BW;x+=14){
        const px=cx.getImageData(x,y,1,1).data;rs+=px[0];gs+=px[1];bs+=px[2];n++;
      }
      const r=rs/n,g=gs/n,b=bs/n;
      const L=lum(r,g,b);
      const cBlack=contrast(L,lum(17,17,17));   // #111 text
      const cWhite=contrast(L,lum(255,255,255));
      if(cBlack<4.5) flags.push({cat:cat.name,id:it.id,name:it.name,rgb:`${r|0},${g|0},${b|0}`,cBlack:cBlack.toFixed(2),cWhite:cWhite.toFixed(2)});
    }
  }
  out='flagged (black #111 text contrast < 4.5 in band): '+flags.length+'\n\n';
  for(const f of flags) out+=`  ${f.id.padEnd(9)} ${('rgb('+f.rgb+')').padEnd(18)} black ${f.cBlack.padStart(5)}  white ${f.cWhite.padStart(5)}  ${f.cat}\n`;
  document.getElementById('log').textContent=out;
  document.title='DONE';
});
</script></body></html>
