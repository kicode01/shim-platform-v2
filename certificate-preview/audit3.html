<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="log" style="font:12px monospace;white-space:pre"></div>
<script>
const W=1122,H=793;
const BX=Math.round(W*0.06),BY=Math.round(H*0.36),BW=Math.round(W*0.88),BH=Math.round(H*0.40);
function lum(r,g,b){const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b)}
function contrast(a,b){const x=Math.max(a,b),y=Math.min(a,b);return (x+0.05)/(y+0.05)}
fetch('./redesigned-backgrounds.json').then(r=>r.json()).then(async d=>{
  var fail=[], worst={v:99,id:''}, rows=[];
  for(const cat of d.categories) for(const it of cat.items){
    const img=new Image();const p=new Promise(res=>{img.onload=res;img.onerror=res});
    img.src=it.url; await p;
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,W,H);
    let rs=0,gs=0,bs=0,n=0;
    for(let y=BY;y<BY+BH;y+=10)for(let x=BX;x<BX+BW;x+=10){const q=cx.getImageData(x,y,1,1).data;rs+=q[0];gs+=q[1];bs+=q[2];n++}
    const L=lum(rs/n,gs/n,bs/n);
    const cBlack=contrast(L,lum(17,17,17)), cWhite=contrast(L,lum(255,255,255));
    const use=it.textScheme==='light'?cWhite:cBlack;
    const useCol=it.textScheme==='light'?'white':'black';
    rows.push([it.id, it.textScheme, useCol, use]);
    if(use<4.5) fail.push(it.id+' scheme='+it.textScheme+' contrast='+use.toFixed(2));
    if(use<worst.v) worst={v:use,id:it.id+' ('+useCol+')'};
  }
  rows.sort((a,b)=>a[3]-b[3]);
  var out='items evaluated against their OWN textScheme: 80\n';
  out+='failures (contrast < 4.5): '+fail.length+'\n';
  if(fail.length) out+=fail.map(function(f){return '  '+f}).join('\n')+'\n';
  out+='\n--- weakest 8 ---\n';
  out+=rows.slice(0,8).map(function(r){return '  '+r[0].padEnd(9)+r[1].padEnd(7)+'uses '+r[2].padEnd(6)+r[3].toFixed(2)+':1'}).join('\n');
  out+='\n\nworst case: '+worst.id+' at '+worst.v.toFixed(2)+':1\n';
  out+='WCAG AA (4.5:1) normal text => '+(fail.length===0?'ALL 80 PASS':'SEE ABOVE');
  document.getElementById('log').textContent=out;
  document.title='DONE';
});
</script></body></html>
