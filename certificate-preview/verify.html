<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Production Verification — Real Presets + Real Fit Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Outfit:wght@100..900&family=Cinzel:wght@400..900&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-inter:"Inter",sans-serif;
    --font-outfit:"Outfit",sans-serif;
    --font-cinzel:"Cinzel",serif;
    --font-cormorant:"Cormorant Garamond",serif;
    --font-script:"Great Vibes",cursive;
    --font-playfair:"Playfair Display",serif;
    --font-spacemono:"Space Mono",monospace;
    --font-spacegrotesk:"Space Grotesk",sans-serif;
    --font-sans:var(--font-inter);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0f172a;color:#e2e8f0;font-family:var(--font-inter);}
  header{padding:32px 32px 8px;max-width:1500px;margin:0 auto;}
  header h1{font-family:var(--font-outfit);font-size:26px;margin:0 0 6px;color:#fff;}
  header p{margin:0;color:#94a3b8;font-size:13px;}
  .wrap{max-width:1500px;margin:0 auto;padding:16px 32px 100px;display:grid;grid-template-columns:1fr;gap:36px;}
  .card{background:#111c33;border:1px solid #1e293b;border-radius:14px;overflow:hidden;}
  .card h2{margin:0;padding:12px 18px;font-family:var(--font-outfit);font-size:14px;background:#152039;border-bottom:1px solid #1e293b;display:flex;gap:10px;align-items:center;color:#fff;}
  .swatch{width:12px;height:12px;border-radius:3px;}
  .card h2 .id{margin-left:auto;font-family:var(--font-spacemono);font-size:11px;color:#64748b;}
  .stage{position:relative;width:100%;aspect-ratio:3508/2480;overflow:hidden;background:#0b1220;}
  .cert-inner{position:absolute;top:0;left:0;transform-origin:top left;width:3508px;height:2480px;background-size:100% 100%;background-position:center;}
  .el{position:absolute;line-height:1.2;white-space:pre-wrap;}
  .sig-nm{white-space:nowrap;font-style:italic;line-height:normal;padding-top:.3em;padding-bottom:.1em;}
  .sig-ln{width:100%;flex-shrink:0;}
  .sig-tt{white-space:nowrap;font-weight:bold;text-transform:uppercase;}
</style>
</head>
<body>
<header>
  <h1>Production Verification — Real Presets + Real Fit Engine</h1>
  <p>Renders <code>src/lib/presets.ts</code> through the real <code>src/lib/fit-text.ts</code> engine (Canvas measureText + binary search). Sample: <em>Maria Clara Delos Santos</em> · <em>Advanced Machine Learning Workshop 2026</em> · <em>SHIM-2026-4A9F2C</em>.</p>
</header>
<div class="wrap" id="wrap"></div>

<script src="fit-text.js?v=9"></script>
<script src="presets-real.js?v=9"></script>
<script>
const SAMPLE = {
  recipientName: "Maria Clara Delos Santos",
  role: "Master of Science in Data Science",
  eventName: "Advanced Machine Learning Workshop 2026",
  certificateId: "SHIM-2026-4A9F2C",
  issueDate: new Date(2026, 4, 15).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}),
  validateUrl: location.origin + "/validate?id=SHIM-2026-4A9F2C"
};
const BADGE = `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
  <defs>
    <linearGradient id="gO" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#eab308"/><stop offset="100%" stop-color="#854d0e"/></linearGradient>
    <linearGradient id="gI" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#fef08a"/><stop offset="40%" stop-color="#eab308"/><stop offset="100%" stop-color="#a16207"/></linearGradient>
  </defs>
  <path d="M 60 10 L 65.7 16.4 L 72.9 11.7 L 76.8 19.3 L 85 16.7 L 86.8 25.1 L 95.4 24.6 L 94.9 33.2 L 103.3 35 L 100.7 43.2 L 108.3 47.1 L 103.6 54.3 L 110 60 L 103.6 65.7 L 108.3 72.9 L 100.7 76.8 L 103.3 85 L 94.9 86.8 L 95.4 95.4 L 86.8 94.9 L 85 103.3 L 76.8 100.7 L 72.9 108.3 L 65.7 103.6 L 60 110 L 54.3 103.6 L 47.1 108.3 L 43.2 100.7 L 35 103.3 L 33.2 94.9 L 24.6 95.4 L 25.1 86.8 L 16.7 85 L 19.3 76.8 L 11.7 72.9 L 16.4 65.7 L 10 60 L 16.4 54.3 L 11.7 47.1 L 19.3 43.2 L 16.7 35 L 25.1 33.2 L 24.6 24.6 L 33.2 25.1 L 35 16.7 L 43.2 19.3 L 47.1 11.7 L 54.3 16.4 Z" fill="url(#gO)"/>
  <circle cx="60" cy="60" r="41" fill="url(#gI)"/>
  <circle cx="60" cy="60" r="36" fill="none" stroke="#fef3c7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  <text x="60" y="58" font-family="Inter,sans-serif" font-size="20" font-weight="900" fill="rgba(255,255,255,.9)" text-anchor="middle">shim</text>
  <text x="60" y="68" font-family="Arial,sans-serif" font-size="6.5" font-weight="900" fill="rgba(254,243,199,.9)" text-anchor="middle" style="letter-spacing:2px">CERTIFIED</text>
</svg>`;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function contentFor(el){
  if(el.type!=="dynamicText") return el.text||"";
  switch(el.text){
    case "recipientName": return SAMPLE.recipientName;
    case "role": return SAMPLE.role;
    case "eventName": return SAMPLE.eventName;
    case "issueDate": return SAMPLE.issueDate;
    case "certificateId": return SAMPLE.certificateId;
    default: return el.text||"";
  }
}

// Mirror CertificateView's fit computation exactly.
function fittedSize(el){
  const content = contentFor(el);
  if(!content) return el.fontSize || 16;
  const ceiling = el.maxFontSize ?? el.fontSize ?? 16;
  const measured = window.fitFontSize({
    text: content,
    fontFamily: el.fontFamily || "var(--font-sans, sans-serif)",
    fontWeight: el.fontWeight,
    fontStyle: el.fontStyle,
    letterSpacing: el.letterSpacing || 0,
    maxLines: el.autoFit ? (el.maxLines ?? 1) : Math.max(1, Math.ceil(content.length/40)),
    lineHeight: 1.2
  }, { width: el.width }, ceiling);
  return (measured < ceiling || el.autoFit) ? measured : (el.fontSize || 16);
}

function renderEl(el){
  const base = `position:absolute;left:${el.x}px;top:${el.y}px;`;
  if(el.type==="qrCode"){
    return `<div style="${base}width:${el.width}px;height:${el.height}px;"><img alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(SAMPLE.validateUrl)}&color=${encodeURIComponent((el.color||"#0f172a").replace("#",""))}" style="width:100%;height:100%;display:block;background:#fcfbf7;padding:6px;border-radius:10px"/></div>`;
  }
  if(el.type==="badge") return `<div style="${base}width:${el.width}px;height:${el.height}px;">${BADGE}</div>`;
  if(el.type==="shape") return `<div style="${base}width:${el.width}px;height:${el.height}px;background:${el.color||"#000"};"></div>`;
  if(el.type==="signature"){
    const name = el.signatoryName ?? (el.text?el.text.split("|")[0]:"Signature");
    const title = el.signatoryTitle ?? (el.text?el.text.split("|")[1]:"Title");
    const fs=(el.fontSize||120)*1.5, tfs=(el.fontSize||120)*(el.titleFontSize??0.4), lp=el.linePadding??10;
    return `<div style="${base}width:${el.width}px;height:${el.height}px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">`+
      `<div class="sig-nm" style="font-family:${el.fontFamily};font-size:${fs}px;color:${el.color||"#000"};">${esc(name)}</div>`+
      `<div class="sig-ln" style="border-top:${el.lineThickness??4}px solid ${el.lineColor||el.color||"#000"};margin-top:${lp}px;margin-bottom:${lp}px;"></div>`+
      `<div class="sig-tt" style="font-size:${tfs}px;font-family:${el.titleFontFamily||"var(--font-sans)"};color:${el.titleColor||el.color||"#000"};letter-spacing:${el.titleLetterSpacing??4}px;">${esc(title)}</div></div>`;
  }
  const content = contentFor(el);
  const fs = fittedSize(el);
  return `<div class="el" style="${base}width:${el.width}px;${el.height?`height:${el.height}px;`:""}font-size:${fs}px;font-family:${el.fontFamily||"var(--font-sans)"};color:${el.color||"#000"};text-align:${el.align||"left"};font-weight:${el.fontWeight||"normal"};font-style:${el.fontStyle||"normal"};letter-spacing:${el.letterSpacing?el.letterSpacing+"px":"normal"};">${esc(content)}</div>`;
}

function draw(){
  const wrap = document.getElementById("wrap");
  wrap.innerHTML = window.REAL_PRESETS.map(p => {
    const els = p.design.canvasElements || [];
    return `<section class="card">
      <h2><span class="swatch" style="background:${p.color}"></span>${esc(p.name)}<span class="id">${p.id}</span></h2>
      <div class="stage"><div class="cert-inner" style="background-image:url(${p.design.backgroundImageUrl});">${els.map(renderEl).join("")}</div></div>
    </section>`;
  }).join("");
  fit();
}

function fit(){
  document.querySelectorAll(".stage").forEach(st=>{
    const inner = st.querySelector(".cert-inner");
    if(inner) inner.style.transform = `scale(${st.clientWidth/3508})`;
  });
}

window.addEventListener("resize", fit);
function boot(){ if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw); else draw(); }
boot();
</script>
</body>
</html>
