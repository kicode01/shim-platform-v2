<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#fdeef1; font-family: system-ui, sans-serif; }
  .canvas { position:relative; width:1122px; height:793px; background:#fdeef1; overflow:hidden; }
  /* exact structure from CanvasDraggableElement */
  .rnd {
    position:absolute;
    padding:2px;
    font-size:100px;
    font-family: 'Space Grotesk', sans-serif;
    color:#e11d48;
    text-align:left;
    font-weight:700;
    line-height:1.2;
    white-space:pre-wrap;
    display:flex;
    align-items:center;
    box-sizing:border-box;
  }
  .rnd.selected { border:2px solid #3b82f6; }
  .inner { width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; }
  .txt { display:block; width:100%; }
</style></head>
<body>
<div class="canvas">
  <!-- Element A: NO height (auto) -->
  <div class="rnd" style="left:263px; top:300px; width:3000px;">
    <div class="inner"><span class="txt">Event Description</span></div>
  </div>

  <!-- Element B: WITH explicit height, mimicking a fixed box -->
  <div class="rnd" style="left:263px; top:470px; width:3000px; height:200px;">
    <div class="inner"><span class="txt">Event Description</span></div>
  </div>

  <!-- Element C: SELECTED with border + padding -->
  <div class="rnd selected" style="left:263px; top:690px; width:3000px;">
    <div class="inner"><span class="txt">Event Description</span></div>
  </div>
</div>
</body></html>
