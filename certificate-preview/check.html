<!doctype html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;background:#e5e7eb;font:11px/1.3 system-ui,sans-serif}
  .cat{padding:10px 14px}
  .cat h2{margin:0 0 8px;font-size:15px;color:#111}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cell{background:#fff;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden}
  .wrap{position:relative;width:100%;aspect-ratio:1122/793;background-size:cover;overflow:hidden}
  .txt{position:absolute;left:6%;width:88%;text-align:center}
  .t1{top:9%;font:600 11px/1.2 Georgia,serif;color:#555;letter-spacing:.14em;text-transform:uppercase}
  .t2{top:38%;font:700 26px/1.05 Georgia,serif;color:#111}
  .t3{top:58%;font:400 14px/1.2 Georgia,serif;color:#333}
  .t4{top:68%;font:400 11px/1.2 Georgia,serif;color:#666}
  .sigs{position:absolute;top:80%;left:6%;width:88%;display:flex;justify-content:space-between}
  .sigs div{width:38%;border-top:1px solid #555;padding-top:3px;font:9px system-ui;color:#555;text-align:center}
  .meta{padding:4px 6px;display:flex;justify-content:space-between;gap:5px}
  .id{font-weight:700;color:#0369a1}
  .nm{color:#475569;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>
<div id="root"></div>
<script>
const Q=new URLSearchParams(location.search);
const SRC=Q.get('src')||'./redesigned-backgrounds.json';
const ONLY=Q.get('cat');
fetch(SRC).then(r=>r.json()).then(d=>{
  const root=document.getElementById('root');
  for(const cat of d.categories){
    if(ONLY&&cat.name!==ONLY)continue;
    const sec=document.createElement('div');sec.className='cat';
    const h=document.createElement('h2');h.textContent=cat.name;sec.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    for(const it of cat.items){
      const c=document.createElement('div');c.className='cell';
      const wr=document.createElement('div');wr.className='wrap';wr.style.backgroundImage='url("'+it.url+'")';
      wr.innerHTML=`<div class="txt t1">Certificate of Completion</div>
        <div class="txt t2">Maria Clara<br>Delos Santos</div>
        <div class="txt t3">Advanced Machine Learning Workshop 2026</div>
        <div class="txt t4">Presenter &amp; Lead Instructor</div>
        <div class="sigs"><div>Signature</div><div>Date</div></div>`;
      const m=document.createElement('div');m.className='meta';
      m.innerHTML='<span class="id">'+it.id+'</span><span class="nm">'+it.name+'</span>';
      c.appendChild(wr);c.appendChild(m);g.appendChild(c);
    }
    sec.appendChild(g);root.appendChild(sec);
  }
});
</script></body></html>
