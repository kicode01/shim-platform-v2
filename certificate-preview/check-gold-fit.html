<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root{ --font-inter:"Inter",sans-serif; --font-cinzel:"Cinzel",serif; --font-sans:var(--font-inter); }
  body{font-family:var(--font-inter);background:#111;color:#eee;padding:20px;margin:0}
  .row{margin:14px 0;padding:10px;background:#1c1c1c;border-radius:8px}
  .big{font-size:13px;color:#8ab4f8}
  canvas{display:none}
</style></head>
<body>
<h3>elegant-gold eventName — real fit engine</h3>
<div id="out"></div>
<script src="fit-text.js"></script>
<script>
const TEXT = "Advanced Machine Learning Workshop 2026";
const BOX = 3100;
const results = [];
for (const ml of [1, 2]) {
  const size = window.fitFontSize(
    { text: TEXT, fontFamily: "var(--font-cinzel, serif)", fontWeight: "600", letterSpacing: 0, maxLines: ml, lineHeight: 1.2 },
    { width: BOX }, 130
  );
  results.push({ maxLines: ml, size });
}
// also report natural width at 130
const c = document.createElement("canvas").getContext("2d");
c.font = "600 130px Cinzel";
const w130 = c.measureText(TEXT).width;
c.font = "600 60px Cinzel";
const w60 = c.measureText(TEXT).width;

document.getElementById("out").innerHTML =
  results.map(r => `<div class="row">maxLines=${r.maxLines} → fitted <b>${r.size}px</b></div>`).join("") +
  `<div class="row big">natural width @130px = ${Math.round(w130)}px (box ${BOX})<br>` +
  `natural width @60px = ${Math.round(w60)}px</div>`;
document.title = "ready";
</script></body></html>
