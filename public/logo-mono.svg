<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Perfect 1:1 isometric S (Pure monochrome mask version) -->
  <mask id="gap-mask">
    <rect width="256" height="256" fill="#FFFFFF" />
    <line x1="28" y1="96" x2="164" y2="96" stroke="#000000" stroke-width="8" stroke-linecap="round" />
    <line x1="92" y1="160" x2="228" y2="160" stroke="#000000" stroke-width="8" stroke-linecap="round" />
  </mask>
  <g mask="url(#gap-mask)" fill="currentColor">
    <!-- Middle Face -->
    <polygon points="32,96 160,96 224,160 96,160" />
    <!-- Top Face -->
    <polygon points="96,32 224,32 160,96 32,96" />
    <!-- Bottom Face -->
    <polygon points="96,160 224,160 160,224 32,224" />
  </g>
</svg>
