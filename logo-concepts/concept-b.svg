<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Right-pointing wedge (left side) -->
  <polygon points="40,32 40,224 136,128" fill="#000000" />
  
  <!-- Left-pointing wedge (right side) -->
  <polygon points="216,32 216,224 120,128" fill="#000000" />
  
  <!-- Cutouts to form an S in the negative space -->
  <polygon points="40,80 136,128 40,176" fill="white" />
  <polygon points="216,80 120,128 216,176" fill="white" />
</svg>
