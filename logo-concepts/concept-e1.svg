<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#000000" />
  <g fill="#000000" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round">
    <!-- Middle Face -->
    <polygon points="40,96 160,96 208,160 88,160" />
    
    <!-- Top Face (Certificate) -->
    <polygon points="88,32 208,32 160,96 40,96" />
    <!-- Certificate Lines -->
    <line x1="100" y1="56" x2="160" y2="56" stroke-linecap="round" />
    <line x1="90" y1="72" x2="140" y2="72" stroke-linecap="round" />
    
    <!-- Card inside pocket -->
    <!-- Card is sticking up from y=192 to y=152 -->
    <polygon points="92,192 92,152 156,152 156,192" />
    <!-- Bottom Face Outline (Wallet) -->
    <polygon points="88,160 208,160 160,224 40,224" />
    <!-- Pocket Line with cutout -->
    <path d="M 64 192 L 112 192 A 12 12 0 0 0 136 192 L 184 192" fill="none" />
    <!-- Snap Button / Seal on the pocket -->
    <circle cx="160" cy="208" r="6" fill="#FFFFFF" />
  </g>
</svg>
