<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <g id="ring">
      <ellipse cx="128" cy="128" rx="104" ry="32" fill="none" stroke="#222" stroke-width="2" />
      <ellipse cx="128" cy="128" rx="88" ry="16" fill="none" stroke="#555" stroke-width="1" />
    </g>
    <!-- Add drop shadow for depth -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="256" height="256" fill="#050505" />
  
  <!-- The Guilloche Rosette -->
  <use href="#ring" />
  <use href="#ring" transform="rotate(15 128 128)" />
  <use href="#ring" transform="rotate(30 128 128)" />
  <use href="#ring" transform="rotate(45 128 128)" />
  <use href="#ring" transform="rotate(60 128 128)" />
  <use href="#ring" transform="rotate(75 128 128)" />
  <use href="#ring" transform="rotate(90 128 128)" />
  <use href="#ring" transform="rotate(105 128 128)" />
  <use href="#ring" transform="rotate(120 128 128)" />
  <use href="#ring" transform="rotate(135 128 128)" />
  <use href="#ring" transform="rotate(150 128 128)" />
  <use href="#ring" transform="rotate(165 128 128)" />
  
  <!-- Detailed Center -->
  <circle cx="128" cy="128" r="56" fill="#111" filter="url(#shadow)" />
  <circle cx="128" cy="128" r="48" fill="none" stroke="#DAA520" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="128" cy="128" r="40" fill="none" stroke="#DAA520" stroke-width="1" />
  
  <!-- Premium S -->
  <path d="M 152 96 C 152 72 104 72 104 96 C 104 116 152 116 152 144 C 152 168 104 168 104 144" fill="none" stroke="#DAA520" stroke-width="12" stroke-linecap="round" />
  <path d="M 152 96 C 152 72 104 72 104 96 C 104 116 152 116 152 144 C 152 168 104 168 104 144" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
</svg>
