<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Solid black canvas -->
  <rect width="256" height="256" fill="#000000" />
  
  <!-- Ribbon S -->
  <!-- It emerges from under the seal and flows into a perfect S -->
  <path d="M 176 80 C 176 56 80 56 80 112 C 80 160 176 160 176 208 C 176 256 80 256 80 208" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="square" />
  
  <!-- Seal at the top right -->
  <!-- We draw a black circle first to mask the path where the seal sits -->
  <circle cx="176" cy="80" r="32" fill="#000000" />
  <!-- A perfectly balanced minimalist ring and dot seal -->
  <circle cx="176" cy="80" r="32" fill="none" stroke="#FFFFFF" stroke-width="16" />
  <circle cx="176" cy="80" r="8" fill="#FFFFFF" />
</svg>
