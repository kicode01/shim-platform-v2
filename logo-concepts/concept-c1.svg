<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#000000" />
  
  <g fill="#000000" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round">
    <!-- Middle Face (Slants Right: \ ) -->
    <!-- Drawn first so it is occluded by top and bottom -->
    <polygon points="40,96 160,96 208,160 88,160" />
    
    <!-- Top Face (Slants Left: / ) -->
    <polygon points="88,32 208,32 160,96 40,96" />
    
    <!-- Bottom Face (Slants Left: / ) -->
    <polygon points="88,160 208,160 160,224 40,224" />
  </g>
</svg>
