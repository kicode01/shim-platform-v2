<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#FFFFFF" />
  <!-- Middle Face -->
  <polygon points="40,96 160,96 208,160 88,160" fill="#999999" />
  <!-- Bottom Face -->
  <polygon points="88,160 208,160 160,224 40,224" fill="#111111" />
  
  <!-- Top Face -->
  <polygon points="88,32 208,32 160,96 40,96" fill="#111111" />
  <!-- Certificate details on Top Face (Subtle dark grey) -->
  <rect x="103" y="52" width="60" height="6" fill="#444444" />
  <rect x="96" y="68" width="50" height="6" fill="#444444" />
  
  <!-- Wallet Strap extending from Top Face -->
  <rect x="108" y="96" width="32" height="44" fill="#111111" />
  <circle cx="124" cy="140" r="16" fill="#111111" />
  
  <!-- Certificate Seal / Snap Closure on the clasp -->
  <circle cx="124" cy="140" r="10" fill="none" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="124" cy="140" r="3" fill="#FFFFFF" />
</svg>
