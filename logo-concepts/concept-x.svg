<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#FFFFFF" />
  
  <!-- Solid black certificate base -->
  <mask id="s-mask">
    <!-- Everything white remains, everything black is cut out -->
    <rect width="256" height="256" fill="#FFFFFF" />
    <!-- The S to cut out -->
    <path d="M 160 80 C 160 56 96 56 96 96 C 96 128 160 128 160 160 C 160 192 96 192 96 168" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="round" />
  </mask>
  
  <rect x="56" y="32" width="144" height="192" fill="#000000" mask="url(#s-mask)" />
  
  <!-- Add a tiny white seal dot inside the black area to anchor the certificate metaphor -->
  <circle cx="168" cy="192" r="12" fill="#FFFFFF" />
</svg>
