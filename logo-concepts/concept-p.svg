<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#DD2476" />
    </linearGradient>
  </defs>
  <!-- Background vibrant gradient squircle -->
  <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#bg)" />
  
  <!-- Middle fold (draw first so it is underneath) -->
  <polygon points="80,104 208,104 176,168 48,168" fill="#E0E0E0" stroke="#E0E0E0" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Top fold -->
  <polygon points="208,64 80,64 80,120 208,120" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
  <!-- Top certificate details -->
  <rect x="96" y="80" width="80" height="8" rx="4" fill="#CCCCCC" />
  <rect x="96" y="96" width="60" height="8" rx="4" fill="#CCCCCC" />
  <!-- A seal on the top right -->
  <circle cx="184" cy="92" r="12" fill="#FFD700" />
  
  <!-- Bottom fold -->
  <polygon points="176,152 48,152 48,208 176,208" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
  <!-- Bottom certificate details -->
  <rect x="64" y="168" width="80" height="8" rx="4" fill="#CCCCCC" />
  <rect x="64" y="184" width="40" height="8" rx="4" fill="#CCCCCC" />
  <!-- Seal / stamp on bottom right -->
  <circle cx="152" cy="180" r="12" fill="#FFD700" />
</svg>
