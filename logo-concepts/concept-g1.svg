<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#F0F0F0" /> 
  <g stroke="#000000" stroke-width="8" stroke-linejoin="round">
    <!-- Middle Face (Wallet Interior) -->
    <polygon points="40,96 160,96 208,160 88,160" fill="#666666" />
    
    <!-- Top Face (Certificate Document) -->
    <polygon points="88,32 208,32 160,96 40,96" fill="#FFFFFF" />
    
    <!-- Bottom Face (Wallet Exterior) -->
    <polygon points="88,160 208,160 160,224 40,224" fill="#111111" />
  </g>
  
  <!-- Certificate Details on Top Face (Black) -->
  <rect x="93" y="52" width="80" height="6" fill="#000000" />
  <rect x="91" y="68" width="60" height="6" fill="#000000" />
  <!-- Certificate Seal -->
  <circle cx="160" cy="72" r="8" fill="#000000" />
  
  <!-- Wallet Details on Bottom Face (White) -->
  <path d="M 84 176 L 124 176 A 12 12 0 0 0 148 176 L 188 176" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <!-- Snap button -->
  <circle cx="115" cy="204" r="6" fill="none" stroke="#FFFFFF" stroke-width="4" />
</svg>
