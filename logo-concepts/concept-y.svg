<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#FFFFFF" />
  
  <!-- Premium Certificate Frame (Mathematically centered) -->
  <!-- Bounding box: x: 48..208 (width 160), y: 32..224 (height 192) -->
  <rect x="48" y="32" width="160" height="192" fill="none" stroke="#000000" stroke-width="2" />
  <rect x="56" y="40" width="144" height="176" fill="none" stroke="#000000" stroke-width="1" />
  <rect x="64" y="48" width="128" height="160" fill="none" stroke="#000000" stroke-width="1" />
  
  <!-- Optically Perfect S -->
  <!-- Top circle: r=40, center=128,80. Bottom circle: r=48, center=128,168 -->
  <path d="M 168 80 A 40 40 0 1 0 128 120 A 48 48 0 1 0 176 168" fill="none" stroke="#000000" stroke-width="24" stroke-linecap="butt" />
  
  <!-- Certificate Seal Dot perfectly positioned in the bottom right frame gap -->
  <circle cx="176" cy="184" r="8" fill="#000000" />
</svg>
