<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M 128 16 L 216 48 L 216 128 C 216 192 128 240 128 240 C 128 240 40 192 40 128 L 40 48 Z" fill="url(#gold)" filter="url(#shadow)" />
  
  <!-- Inner Shield -->
  <path d="M 128 32 L 200 56 L 200 128 C 200 176 128 216 128 216 C 128 216 56 176 56 128 L 56 56 Z" fill="url(#shieldGrad)" />
  
  <!-- Detailed elements: a sunburst inside the shield -->
  <path d="M 128 128 L 56 56 M 128 128 L 200 56 M 128 128 L 56 128 M 128 128 L 200 128 M 128 128 L 80 200 M 128 128 L 176 200" stroke="#444" stroke-width="2" />
  
  <!-- S Monogram -->
  <text x="128" y="148" font-family="Georgia, Times New Roman, serif" font-size="96" font-weight="bold" fill="url(#gold)" text-anchor="middle">S</text>
  
  <!-- Ribbon across the front -->
  <path d="M 16 160 L 64 144 L 192 144 L 240 160 L 216 184 L 240 208 L 192 192 L 64 192 L 16 208 L 40 184 Z" fill="url(#gold)" filter="url(#shadow)" />
  <path d="M 56 152 L 200 152 L 200 184 L 56 184 Z" fill="#222" />
  <text x="128" y="174" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="4">SHIM</text>
</svg>
