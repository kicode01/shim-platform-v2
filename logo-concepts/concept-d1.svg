<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#F0F0F0" />
  
  <g stroke="#000000" stroke-width="8" stroke-linejoin="round">
    <!-- Middle Face (Grey paper, Slants Right: \ ) -->
    <polygon points="40,96 160,96 208,160 88,160" fill="#CCCCCC" />
    
    <!-- Top Face (White paper, Slants Left: / ) -->
    <polygon points="88,32 208,32 160,96 40,96" fill="#FFFFFF" />
    
    <!-- Bottom Face (White paper, Slants Left: / ) -->
    <polygon points="88,160 208,160 160,224 40,224" fill="#FFFFFF" />
  </g>
  
  <!-- Top Face Details (Certificate Lines) -->
  <rect x="76" y="52" width="80" height="6" fill="#000000" />
  <rect x="64" y="68" width="60" height="6" fill="#000000" />
  
  <!-- Bottom Face Details (Certificate Seal) -->
  <circle cx="144" cy="192" r="16" fill="#000000" />
  <circle cx="144" cy="192" r="8" fill="#FFFFFF" />
</svg>
