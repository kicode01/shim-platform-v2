<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FA2FF" />
      <stop offset="50%" stop-color="#12D8FA" />
      <stop offset="100%" stop-color="#A6FFCB" />
    </linearGradient>
  </defs>
  <!-- Background gradient squircle -->
  <rect x="24" y="24" width="208" height="208" rx="56" fill="url(#grad3)" />
  
  <!-- Modern minimalist certificate border -->
  <rect x="64" y="56" width="128" height="144" rx="16" fill="none" stroke="#FFFFFF" stroke-width="12" />
  
  <!-- Minimalist S inside, perfectly centering -->
  <!-- Top half of S -->
  <path d="M 144 96 C 144 80 112 80 112 96 C 112 112 144 112 144 128 C 144 144 112 144 112 128" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  
  <!-- Add a certificate badge/seal intersecting the border at bottom right -->
  <circle cx="192" cy="200" r="20" fill="#FFFFFF" />
  <circle cx="192" cy="200" r="8" fill="url(#grad3)" />
