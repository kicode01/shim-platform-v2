<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#000000" />
  
  <!-- Extremely bold Ribbon S, optically balanced (Top r=40, Bottom r=48) -->
  <path d="M 168 80 A 40 40 0 1 0 128 120 A 48 48 0 1 0 176 168" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" />
  
  <!-- To signify the "seal" at the start of the ribbon, a perfect black dot -->
  <!-- The stroke-linecap="round" creates a perfect circle of r=24 at the start (168,80) -->
  <circle cx="168" cy="80" r="10" fill="#000000" />
</svg>
